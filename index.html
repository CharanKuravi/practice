  clearInterval(tm);
  const p=pool(),n=p.length;
  app.innerHTML=`<h1>🎯 NPTEL AI Exam Prep</h1><div class="mu">Introduction to Artificial Intelligence · ${TOTAL} questions across 12 assignments · all questions and options are reshuffled every attempt</div>
  <div class="card"><div class="row"><b>1. Choose assignments</b><span><button class="chip" id="all">All</button> <button class="chip" id="none">None</button></span></div><div class="chips" style="margin-top:10px">${U.map((u,i)=>`<button class="chip ${sel.has(i)?"on":""}" data-u="${i}">${i+1}. ${esc(u.n)} (${u.q.length})</button>`).join("")}</div></div>
  <div class="card"><b>2. Number of questions</b><div class="chips" style="margin-top:10px">${[0,10,20,30,60].map(c=>`<button class="chip ${cnt===c?"on":""}" data-c="${c}">${c?c:"All selected ("+n+")"}</button>`).join("")}</div></div>
  <div class="card"><b>3. Mode</b><div class="chips" style="margin-top:10px"><button class="chip ${mode==="practice"?"on":""}" data-m="practice">Practice – instant right/wrong</button><button class="chip ${mode==="exam"?"on":""}" data-m="exam">Exam – results at the end</button></div></div>
  <div class="act"><button class="btn" id="go" ${n?"":"disabled"}>Start · ${cnt?Math.min(cnt,n):n} questions</button></div>`;
  app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const i=+b.dataset.u;sel.has(i)?sel.delete(i):sel.add(i);home()});
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cnt=+b.dataset.c;home()});
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;home()});
  $("#all").onclick=()=>{sel=new Set(U.map((_,i)=>i));home()};
  $("#none").onclick=()=>{sel=new Set();home()};
  $("#go").onclick=()=>start(build(pool()).slice(0,cnt||1e9));
}
function start(list){
  S={l:list,i:0,s:null,ck:false,ans:[],t0:Date.now()};
  clearInterval(tm);tm=setInterval(()=>{const e=$("#tm");if(e)e.textContent=fmt((Date.now()-S.t0)/1000|0)},1000);
  quiz();
}
const fmt=s=>(s/60|0)+":"+String(s%60).padStart(2,"0");
function quiz(){
  const q=S.l[S.i],last=S.i===S.l.length-1;
  const sc=S.ans.filter(a=>a.ok).length;
  app.innerHTML=`<div class="top"><div class="row mu"><span>Question ${S.i+1} / ${S.l.length}</span>${mode==="practice"?`<span>✔ ${sc} · ✘ ${S.ans.length-sc}</span>`:""}<span>⏱ <span id="tm">${fmt((Date.now()-S.t0)/1000|0)}</span></span></div><div class="bar" style="margin-top:6px"><i style="width:${S.i/S.l.length*100}%"></i></div></div>
  <div class="card"><span class="tag">Assignment ${q.u+1} · ${esc(U[q.u].n)}</span><div class="q">${esc(q.t)}</div>
  ${q.o.map((o,k)=>{let c="o";if(S.ck){if(k===q.c)c+=" ok";else if(k===S.s)c+=" bad"}else if(k===S.s)c+=" s";return `<button class="${c}" data-k="${k}"><b>${L[k]}</b><span>${esc(o)}</span></button>`}).join("")}
  ${S.ck?(S.s===q.c?`<div class="fb ok">✔ Correct!</div>`:`<div class="fb bad">✘ Wrong. Correct answer: ${L[q.c]}. ${esc(q.o[q.c])}</div>`):""}</div>
  <div class="act"><button class="btn g" id="quit">Quit</button>${mode==="practice"&&!S.ck?`<button class="btn" id="nx" ${S.s===null?"disabled":""}>Check answer</button>`:`<button class="btn" id="nx" ${S.s===null?"disabled":""}>${last?"Finish":"Next →"}</button>`}</div>
  <p class="mu tip">Tip: press A–D (or 1–4) to choose, Enter to continue.</p>`;
  app.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $("#nx").onclick=next;$("#quit").onclick=()=>{if(confirm("Quit this attempt?"))home()};
}
function pick(k){if(S.ck)return;S.s=k;quiz()}
function next(){
  const q=S.l[S.i];
  if(S.s===null)return;
  if(mode==="practice"&&!S.ck){S.ck=true;S.ans.push({s:S.s,ok:S.s===q.c});quiz();const f=$(".fb");if(f)f.scrollIntoView({block:"center",behavior:"smooth"});return}
  if(mode==="exam")S.ans.push({s:S.s,ok:S.s===q.c});
  if(S.i===S.l.length-1){finish();return}
  S.i++;S.s=null;S.ck=false;quiz();scrollTo(0,0);
}
function finish(){
  clearInterval(tm);
  const n=S.l.length,ok=S.ans.filter(a=>a.ok).length,pc=Math.round(ok/n*100),el=(Date.now()-S.t0)/1000|0;
  const by={};S.l.forEach((q,i)=>{by[q.u]=by[q.u]||[0,0];by[q.u][1]++;if(S.ans[i].ok)by[q.u][0]++});
  const wrong=S.l.map((q,i)=>({q,a:S.ans[i]})).filter(x=>!x.a.ok);
  app.innerHTML=`<h1>Result</h1><div class="card"><div class="big" style="color:${pc>=60?"var(--ok)":"var(--bad)"}">${ok} / ${n}</div><div class="mu" style="text-align:center">${pc}% · ${fmt(el)} · ${pc>=80?"Excellent! 🎉":pc>=60?"Good, keep revising 👍":"Needs more practice 💪"}</div>
  <div class="st" style="margin-top:14px"><div><b style="color:var(--ok)">${ok}</b>Correct</div><div><b style="color:var(--bad)">${n-ok}</b>Wrong</div><div><b>${pc}%</b>Score</div></div></div>
  <div class="row res"><button class="btn" id="re">🔀 Reshuffle &amp; restart</button>${wrong.length?`<button class="btn g" id="rw">Retry wrong (${wrong.length})</button>`:""}<button class="btn g" id="hm">Home</button></div>
  <h2>By assignment</h2><div class="card">${Object.keys(by).map(u=>`<div class="row"><span>${+u+1}. ${esc(U[u].n)}</span><b>${by[u][0]}/${by[u][1]}</b></div>`).join("")}</div>
  <h2>${wrong.length?"Review mistakes":"Perfect score! 🏆"}</h2>${wrong.map(x=>`<div class="card rv"><p><b>${esc(x.q.t)}</b></p><p style="color:var(--bad)">✘ Your answer: ${esc(x.q.o[x.a.s])}</p><p style="color:var(--ok)">✔ Correct: ${esc(x.q.o[x.q.c])}</p></div>`).join("")}`;
  $("#re").onclick=()=>start(build(pool()).slice(0,cnt||1e9));
  if($("#rw"))$("#rw").onclick=()=>start(build(wrong.map(x=>({t:x.q.t,a:x.q.o[x.q.c],ws:x.q.o.filter((_,k)=>k!==x.q.c),u:x.q.u}))));
  $("#hm").onclick=home;scrollTo(0,0);
}
document.addEventListener("keydown",e=>{
  if(!S||!$(".o"))return;
  const k=L.indexOf(e.key.toUpperCase()),d=+e.key-1;
  if(k>=0&&k<4&&e.key.length===1)pick(k);else if(d>=0&&d<4)pick(d);else if(e.key==="Enter")next();
});
home();
</script>
</body>
</html>
